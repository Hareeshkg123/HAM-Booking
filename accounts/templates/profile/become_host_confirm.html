{% extends "base.html" %}
{% block body %}
<div class="container my-5">
  <h2>Become a host</h2>
  <p>Click the button below to enable hosting features for your account.</p>
  <form method="post">
    {% csrf_token %}
    <button class="btn btn-primary">Enable hosting</button>
    <a href="{% url 'accounts:profile' %}" class="btn btn-link">Cancel</a>
  </form>
</div>
{% endblock %}
